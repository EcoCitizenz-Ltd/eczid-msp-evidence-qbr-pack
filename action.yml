name: "ECZ-ID MSP Evidence & QBR Pack"
description: "Create deterministic machine-trust evidence packs for MSP QBR, vCISO, insurance and regulatory review."
author: EcoCitizenz Ltd
branding:
  icon: shield
  color: green
inputs:
  path:
    description: "Repository-relative path to inspect."
    required: false
    default: "."
  client-id:
    description: "Optional MSP/customer identifier recorded locally in the pack."
    required: false
  profile:
    description: "generic, qbr, vciso, cyber-insurance, nis2, iso27001, soc2, or dora."
    required: false
    default: "qbr"
  output-json:
    description: "Repository-relative JSON evidence pack path."
    required: false
    default: "eczid-msp-evidence-pack.json"
  output-markdown:
    description: "Repository-relative Markdown client summary path."
    required: false
    default: "eczid-msp-evidence-pack.md"
  fail-on:
    description: "invalid or never."
    required: false
    default: "invalid"
outputs:
  result-state:
    description: "EVIDENCE_PACK_CREATED or INVALID_INPUT."
    value: ${{ steps.delegate.outputs['result-state'] }}
  evidence-hash:
    description: "SHA-256 hash of the normalized technical evidence payload."
    value: ${{ steps.delegate.outputs['evidence-hash'] }}
  observed-count:
    description: "Number of evidence observations marked observed."
    value: ${{ steps.delegate.outputs['observed-count'] }}
  not-observed-count:
    description: "Number of evidence observations marked not_observed."
    value: ${{ steps.delegate.outputs['not-observed-count'] }}
  json-path:
    description: "Path to the JSON evidence pack."
    value: ${{ steps.delegate.outputs['json-path'] }}
  markdown-path:
    description: "Path to the Markdown client summary."
    value: ${{ steps.delegate.outputs['markdown-path'] }}
  next-action-url:
    description: "Contextual recurring-service next step when a managed-evidence need is indicated."
    value: ${{ steps.delegate.outputs['next-action-url'] }}
runs:
  using: composite
  steps:
    - id: delegate
      uses: EcoCitizenz-Ltd/eczid-msp-machine-trust-toolkit/actions/evidence-qbr-pack@fedb5cb7633e7cf74c952291a7fbe302e5333af6
      with:
        path: ${{ inputs['path'] }}
        client-id: ${{ inputs['client-id'] }}
        profile: ${{ inputs['profile'] }}
        output-json: ${{ inputs['output-json'] }}
        output-markdown: ${{ inputs['output-markdown'] }}
        fail-on: ${{ inputs['fail-on'] }}
